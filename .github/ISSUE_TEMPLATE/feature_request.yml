name: 功能建议
description: 提出新功能，或改进现有行为
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        先说困扰，再说方案。清楚的问题描述比完整的实现设计更有价值。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 现在的做法为什么不够用，你卡在哪儿。
      placeholder: |
        我需要……，但现在只能……，所以每次都得手动……
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: 变更类型
      options:
        - 新功能
        - 改进现有功能
        - 性能优化
        - 开发体验与工程配置
        - 其他
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你设想的做法
      description: 有想法就写，没想清楚可以留空。

  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案
      description: 你考虑过但放弃的路子，以及为什么放弃。

  - type: checkboxes
    id: contribute
    attributes:
      label: 参与意愿
      options:
        - label: 我愿意提 PR 来实现这个
